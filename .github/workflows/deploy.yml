name: Deploy to cPanel

on:
  push:
    branches:
      - master

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, json, libxml, bcmath, fileinfo
          tools: composer:v2

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci || npm install
          npm run build

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CPANEL_SSH_KEY }}

      - name: Add Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.CPANEL_SSH_PORT || 22 }} -H ${{ secrets.CPANEL_SSH_HOST }} >> ~/.ssh/known_hosts

      # 1. Sync backend application files to /home/USERNAME/portfolio/
      - name: Deploy Backend to cPanel (portfolio folder)
        run: |
          rsync -avz --delete \
            --exclude='.git*' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='storage/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='phpunit.xml' \
            -e "ssh -p ${{ secrets.CPANEL_SSH_PORT || 22 }}" \
            ./ ${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }}:/home/${{ secrets.CPANEL_SSH_USER }}/portfolio/

      # 2. Sync public assets (Vite build, images, styles) directly to public_html
      # Safely preserves index.php, .htaccess, .well-known, and the storage symlink
      - name: Deploy Public Assets to public_html
        run: |
          rsync -avz \
            --exclude='index.php' \
            --exclude='.htaccess' \
            --exclude='.well-known/' \
            --exclude='storage/' \
            --exclude='storage' \
            -e "ssh -p ${{ secrets.CPANEL_SSH_PORT || 22 }}" \
            ./public/ ${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }}:/home/${{ secrets.CPANEL_SSH_USER }}/public_html/

      # 3. Run migrations and clear/rebuild Laravel caches
      - name: Execute Post-Deployment Commands on cPanel
        run: |
          ssh -p ${{ secrets.CPANEL_SSH_PORT || 22 }} ${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }} << 'EOF'
            set -e
            cd /home/${{ secrets.CPANEL_SSH_USER }}/portfolio

            # Ensure storage directories exist with correct permissions
            mkdir -p storage/framework/{sessions,views,cache} storage/logs bootstrap/cache
            chmod -R 775 storage bootstrap/cache

            # Run database migrations and cache optimizations
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
          EOF
